server.port=${PORT:8080}
logging.level.org.atmosphere = warn
spring.mustache.check-template-location = false

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true
# PostgreSQL configuration.
spring.datasource.url = jdbc:postgresql://localhost:5432/irweb
spring.datasource.username = ${SPRING_DATASOURCE_USERNAME:irweb}
spring.datasource.password = ${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto = update
# To improve the performance during development.
# For more information https://vaadin.com/docs/flow/spring/tutorial-spring-configuration.html#special-configuration-parameters
vaadin.whitelisted-packages = com.vaadin,org.vaadin,dev.hilla,jp.ac.chitose.ir,com.github.appreciated.apexcharts
spring.jpa.defer-datasource-initialization = true

spring.jackson.deserialization.accept-single-value-as-array=true

fastapi.url = http://localhost:8000